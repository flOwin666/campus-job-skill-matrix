services:
  - type: web
    name: campus-job-backend
    runtime: node
    plan: free
    buildCommand: cd v6 && npm install
    startCommand: cd v6 && node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_ENDPOINT
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
